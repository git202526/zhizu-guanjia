<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>智租管家 · 租房管理</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%232E90FA' d='M12 3 2 12h3v8h6v-5h2v5h6v-8h3L12 3z'/%3E%3C/svg%3E">
<style>
/* ================= 主题变量 ================= */
:root{
  --bg:#F2F6FB; --card:#FFFFFF; --ink:#1B2537; --sub:#5C6B84; --muted:#93A1B5;
  --primary:#2E90FA; --primary-d:#1C7EF0; --primary-soft:#E3F0FE;
  --up:#E5484D; --up-soft:#FDEBEC; --down:#1FA36B; --down-soft:#E3F6EE;
  --warn:#F79009; --warn-soft:#FEF1DC; --empty:#A8B3C4; --empty-soft:#EEF1F6;
  --line:#E7EDF5; --r:16px; --shadow:0 1px 3px rgba(27,43,77,.05),0 4px 16px rgba(27,43,77,.05);
  --navbg:rgba(255,255,255,.92); --mask:rgba(20,30,50,.45); --toastbg:rgba(27,37,55,.92);
}
html[data-theme="dark"]{
  --bg:#0E1524; --card:#17202F; --ink:#E7EDF7; --sub:#94A3BE; --muted:#5E6D8A;
  --primary:#2DD4BF; --primary-d:#5EEAD4; --primary-soft:rgba(45,212,191,.13);
  --up:#F87171; --up-soft:rgba(248,113,113,.14); --down:#4ADE80; --down-soft:rgba(74,222,128,.13);
  --warn:#FBBF24; --warn-soft:rgba(251,191,36,.14); --empty:#5E6D8A; --empty-soft:rgba(94,109,138,.16);
  --line:#26324A; --r:12px; --shadow:0 1px 0 rgba(255,255,255,.02),0 3px 14px rgba(0,0,0,.28);
  --navbg:rgba(11,17,29,.92); --mask:rgba(0,0,0,.6); --toastbg:rgba(230,237,247,.95);
  --gold:#D9A441;
}
html[data-theme="dark"] #toast{color:#0E1524}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.wrap{max-width:600px;margin:0 auto;padding:14px 16px 100px}
/* ================= 顶栏 ================= */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.appbar h1{font-size:21px;font-weight:800;letter-spacing:.5px}
.appbar .right{display:flex;align-items:center;gap:8px}
.appbar .date{font-size:12px;color:var(--muted)}
.theme-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--sub)}
.theme-btn svg{width:17px;height:17px}
/* ================= 卡片 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card h2 .more{font-size:12px;color:var(--primary);font-weight:600;cursor:pointer}
/* ================= 汇总 ================= */
.hero{background:linear-gradient(150deg,#2E90FA 0%,#55A6F8 100%);border:none;color:#fff;position:relative;overflow:hidden}
html[data-theme="dark"] .hero{background:linear-gradient(150deg,#13203A 0%,#1B2B4E 100%);border:1px solid rgba(217,164,65,.32);color:#E7EDF7}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
html[data-theme="dark"] .hero::after{background:rgba(217,164,65,.12)}
.hero .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:relative;z-index:1}
.hero .top b{font-size:16px;letter-spacing:1px}
html[data-theme="dark"] .hero .top b{color:var(--gold)}
.hero .top span{font-size:12px;opacity:.85}
.hero .big{font-size:30px;font-weight:800;letter-spacing:.5px;position:relative;z-index:1;line-height:1.2}
.hero .big small{font-size:13px;font-weight:600;opacity:.85;margin-left:8px}
.hero .stats{display:flex;gap:16px;margin-top:12px;position:relative;z-index:1;flex-wrap:wrap}
.hero .stats div{font-size:11.5px;opacity:.8;line-height:1.4}
.hero .stats b{display:block;font-size:15px;font-weight:700;opacity:1}
/* ================= 待办 ================= */
.todo-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.todo-item:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.dot.up{background:var(--up)}.dot.warn{background:var(--warn)}.dot.primary{background:var(--primary)}.dot.down{background:var(--down)}
.todo-item .t{flex:1;font-size:14px}
.todo-item .n{font-size:13px;font-weight:700}
.todo-item .n.up{color:var(--up)}.todo-item .n.warn{color:var(--warn)}.todo-item .n.primary{color:var(--primary)}
/* ================= 行 / 标签 ================= */
.bill-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.bill-row:last-child{border-bottom:none}
.room-tag{width:42px;height:42px;border-radius:12px;background:var(--primary-soft);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 42px}
.bill-row .info{flex:1;min-width:0}
.bill-row .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-row .info span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-row .amt{text-align:right;flex:0 0 auto}
.bill-row .amt b{display:block;font-size:15px;font-weight:800}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;margin-top:3px}
.chip.up{background:var(--up-soft);color:var(--up)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.down{background:var(--down-soft);color:var(--down)}
.chip.primary{background:var(--primary-soft);color:var(--primary-d)}
.chip.empty{background:var(--empty-soft);color:var(--empty)}
.row-actions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.row-actions button{border:1px solid var(--line);background:var(--card);border-radius:8px;font-size:11.5px;padding:4px 9px;color:var(--sub);cursor:pointer}
.row-actions button.pri{border-color:var(--primary);color:var(--primary-d);background:var(--primary-soft)}
.row-actions button:active{opacity:.7}
/* ================= 快捷 ================= */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 4px;font-size:12px;color:var(--ink);box-shadow:var(--shadow)}
.quick button svg{display:block;margin:0 auto 6px;width:22px;height:22px}
.quick button:active{transform:scale(.96)}
/* ================= 房源 ================= */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px}
.search svg{width:16px;height:16px;stroke:var(--muted);flex:0 0 16px}
.search input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--ink)}
.chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:7px 14px;border-radius:999px;font-size:13px}
.chips button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
html[data-theme="dark"] .chips button.on{color:#0E1524}
.prop-title{font-size:14px;font-weight:700;color:var(--sub);margin:6px 2px 10px}
.prop-title b{color:var(--ink);font-size:15px}
.room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.room{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);position:relative}
.room:active{transform:scale(.97)}
.room .code{font-size:16px;font-weight:800}
.room .rent{font-size:12px;color:var(--sub);margin:3px 0 8px}
.room .st{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.room .st.rented{background:var(--primary-soft);color:var(--primary-d)}
.room .st.vacant{background:var(--empty-soft);color:var(--empty)}
.room .st.overdue{background:var(--up-soft);color:var(--up)}
.room .st.expiring{background:var(--warn-soft);color:var(--warn)}
.room .st.reserved{background:var(--primary-soft);color:var(--primary-d)}
.room.bd-rented{border-color:var(--primary)}
.room.bd-vacant{border-color:var(--line)}
.room.bd-overdue{border-color:var(--up)}
.room.bd-expiring{border-color:var(--warn)}
.room.bd-reserved{border-color:var(--primary)}
/* ================= 租客 ================= */
.tenant-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-soft);color:var(--primary-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:0 0 40px}
.tenant-row .info{flex:1;min-width:0}
.tenant-row .info b{display:block;font-size:14.5px}
.tenant-row .info span{font-size:12px;color:var(--muted)}
/* ================= 账单 ================= */
.subtabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.subtabs button{flex:1;border:none;background:transparent;padding:8px 0;border-radius:9px;font-size:13.5px;color:var(--sub);cursor:pointer}
.subtabs button.on{background:var(--primary);color:#fff;font-weight:700}
html[data-theme="dark"] .subtabs button.on{color:#0E1524}
.sum2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum2 .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.sum2 .item span{font-size:12px;color:var(--muted)}
.sum2 .item b{display:block;font-size:19px;font-weight:800;margin-top:2px}
.meter-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.meter-row:last-child{border-bottom:none}
.meter-row .info{flex:1;min-width:0}
.meter-row .info b{display:block;font-size:14px}
.meter-row .info span{font-size:12px;color:var(--muted);display:block}
.mode{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin:1px 3px 1px 0}
.mode.meter{background:var(--primary-soft);color:var(--primary-d)}
.mode.prepaid{background:var(--empty-soft);color:var(--empty)}
.mini-btn{padding:7px 14px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--primary-d);font-size:12.5px;font-weight:700;flex:0 0 auto}
/* ================= 日历 ================= */
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 10px 14px}
.cal-hd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.cal-hd i{font-style:normal;text-align:center;font-size:11.5px;color:var(--muted);padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-grid>i{position:relative;font-style:normal;text-align:center;padding:9px 0 12px;font-size:14px;color:var(--ink);border-radius:9px}
.cal-grid>i.today{background:var(--primary-soft);color:var(--primary-d);font-weight:800}
.cal-grid>i span{position:absolute;left:50%;bottom:4px;width:5px;height:5px;border-radius:50%;margin-left:-2.5px}
.cal-grid>i span.d-bill{background:var(--primary)}
.cal-grid>i span.d-exp{background:var(--warn)}
.cal-grid>i span.d-rsv{background:#7C5CFC}
.dot-l{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot-l.bill{background:var(--primary)}
.dot-l.exp{background:var(--warn)}
.dot-l.rsv{background:#7C5CFC}
/* ================= 我的 ================= */
.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.menu .mi{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.menu .mi:last-child{border-bottom:none}
.menu .mi svg{width:20px;height:20px;flex:0 0 20px}
.menu .mi .t{flex:1;font-size:14.5px}
.menu .mi .v{font-size:12.5px;color:var(--muted)}
.fen-card{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fen-card .it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.fen-card .it span{font-size:12px;color:var(--muted);display:block}
.fen-card .it b{display:block;font-size:18px;font-weight:800;margin-top:3px}
.mini-bars{display:flex;align-items:flex-end;gap:6px;height:52px;margin-top:10px}
.mini-bars i{flex:1;border-radius:5px 5px 0 0;background:var(--primary-soft)}
.mini-bars i.r{background:var(--up-soft)}.mini-bars i.g{background:var(--down-soft)}
/* ================= 底部导航 ================= */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--navbg);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:50}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
.tabbar button{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--muted);font-size:11px}
.tabbar button svg{width:22px;height:22px}
.tabbar button .ic{width:34px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.tabbar button.on{color:var(--primary-d);font-weight:700}
html[data-theme="dark"] .tabbar button.on{color:var(--primary)}
.tabbar button.on .ic{background:var(--primary-soft)}
/* ================= 弹层 / 表单 ================= */
.sheet-mask,.modal-mask{position:fixed;inset:0;background:var(--mask);z-index:100;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-mask.show,.modal-mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;z-index:101;transform:translateY(105%);transition:transform .25s;max-width:600px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet .bar{width:40px;height:4px;border-radius:2px;background:var(--line);margin:10px auto 4px}
.sheet .hd{padding:8px 20px 4px;font-size:17px;font-weight:800}
.sheet .bd{padding:8px 20px 26px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-of-type{border-bottom:none}
.kv span{color:var(--sub);flex:0 0 auto}
.kv b{font-weight:700;text-align:right}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sheet .acts button{padding:12px 0;border-radius:12px;border:none;font-size:14px;font-weight:700}
.sheet .acts .btn-pri{background:var(--primary);color:#fff}
html[data-theme="dark"] .sheet .acts .btn-pri{color:#0E1524}
.sheet .acts .btn-ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.sheet .acts .btn-warn{background:var(--up-soft);color:var(--up)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);background:var(--card);border:1px solid var(--line);border-radius:18px;z-index:101;width:min(92vw,440px);max-height:86vh;overflow:auto;opacity:0;pointer-events:none;transition:all .2s;padding:20px}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;outline:none}
.form-row input:focus,.form-row select:focus{border-color:var(--primary)}
.form-row .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .acts{display:flex;gap:10px;margin-top:16px}
.modal .acts button{flex:1;padding:12px 0;border-radius:12px;border:none;font-size:14.5px;font-weight:700}
.modal .acts .btn-pri{background:var(--primary);color:#fff}
html[data-theme="dark"] .modal .acts .btn-pri{color:#0E1524}
.modal .acts .btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--ink)}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;border:none;background:transparent;padding:7px 0;border-radius:8px;font-size:13px;color:var(--sub)}
.seg button.on{background:var(--primary);color:#fff;font-weight:700}
html[data-theme="dark"] .seg button.on{color:#0E1524}
/* ================= Toast ================= */
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(10px);background:var(--toastbg);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ================= 照片账单预览 / 打印 ================= */
#billPreview{width:100%;border-radius:12px;border:1px solid var(--line)}
#printArea{display:none}
@media print{
  body>*{display:none!important}
  #printArea{display:block!important}
  @page{size:58mm auto;margin:0}
}
#printArea .r58{width:58mm;font-family:"Courier New",monospace;font-size:10px;line-height:1.5;color:#000;background:#fff;padding:3mm}
#printArea .r58 .c{text-align:center}
#printArea .r58 h2{font-size:13px;margin:1mm 0}
#printArea .r58 table{width:100%;border-collapse:collapse;font-size:10px}
#printArea .r58 td{padding:1px 0}
#printArea .r58 .sep{border-top:1px dashed #000;margin:1.5mm 0}
/* ================= 桌面端 ================= */
@media(min-width:900px){
  .tabbar{top:0;right:auto;width:196px;border-top:none;border-right:1px solid var(--line)}
  .tabbar .in{max-width:none;grid-template-columns:1fr;padding:26px 12px;gap:4px;align-content:start}
  .tabbar button{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:14px;border-radius:12px}
  .tabbar button .ic{width:34px;height:34px;border-radius:10px}
  .wrap{margin-left:196px;max-width:720px;padding:22px 28px 60px}
  .room-grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">
    <h1 id="appTitle">智租管家</h1>
    <div class="right"><span class="date" id="appDate"></span>
      <button class="theme-btn" id="themeBtn" title="切换日/夜主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
  <main id="view"></main>
</div>
<nav class="tabbar"><div class="in" id="tabbar"></div></nav>
<div class="sheet-mask" id="sheetMask"></div>
<div class="sheet" id="sheet"><div class="bar"></div><div id="sheetBody"></div></div>
<div class="modal-mask" id="modalMask"></div>
<div class="modal" id="modal"><h3 id="modalTitle"></h3><div id="modalBody"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
/* ================= 工具 ================= */
var KEY='zzgj_v1';
function pad(n){return n<10?'0'+n:''+n}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return fmtDate(new Date())}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function curYm(){return ym(new Date())}
function addDays(ds,n){var d=new Date(ds);d.setDate(d.getDate()+n);return fmtDate(d)}
function daysTo(ds){return Math.round((new Date(ds)-new Date(todayStr()))/864e5)}
function prevYm(p){var a=p.split('-');var y=+a[0],m=+a[1]-1;if(m===0){m=12;y--}return y+'-'+pad(m)}
function $(s){return document.querySelector(s)}
function fmt(n){return '¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}

/* ================= 主题 ================= */
function applyTheme(){
  var t=DB.settings.theme||'auto';
  var dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}
function cycleTheme(){DB.settings.theme=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';save();applyTheme();render()}
/* ================= 业务工具 ================= */
function room(id){for(var i=0;i<DB.rooms.length;i++)if(DB.rooms[i].id===id)return DB.rooms[i]}
function prop(id){for(var i=0;i<DB.props.length;i++)if(DB.props[i].id===id)return DB.props[i]}
function billsOf(rid){return DB.bills.filter(function(b){return b.roomId===rid})}
function readingOf(rid,p){for(var i=0;i<DB.readings.length;i++)if(DB.readings[i].roomId===rid&&DB.readings[i].p===p)return DB.readings[i]}
function rStatus(r){
  if(!r.tName)return r.reserve?'reserved':'vacant';
  var ov=billsOf(r.id).some(function(b){return b.st==='unpaid'&&daysTo(b.due)<0});
  if(ov)return'overdue';
  if(r.cEnd&&daysTo(r.cEnd)<=30&&daysTo(r.cEnd)>=0)return'expiring';
  return'rented';
}
function overdueDays(b){var d=daysTo(b.due);return d<0?-d:0}
function billNo(p){var c=0;DB.bills.forEach(function(b){if(b.p===p)c++});return 'NO.'+p.replace('-','')+'-'+('000'+(c+1)).slice(-3)}
function lateFee(b){
  var st=DB.settings;
  if(!st.lateOn||b.lateOff||b.st!=='unpaid')return 0;
  var od=overdueDays(b);if(od<=0)return 0;
  var fee=b.amt*(st.lateRate||0)/100*od;
  var cap=b.amt*(st.lateCap||0)/100;
  return Math.min(Math.round(fee*100)/100,Math.round(cap*100)/100);
}
function dueOf(r,p){return p+'-'+pad(r.rentDay)}
function pushHistory(r,note){
  if(!r.tName)return;
  r.history=r.history||[];
  r.history.unshift({name:r.tName,phone:r.tPhone,cStart:r.cStart,cEnd:r.cEnd,note:note,date:todayStr()});
}
function genBill(rid,p){
  var r=room(rid);if(!r||!r.tName)return null;
  var ex=billsOf(rid).filter(function(b){return b.p===p&&b.st==='unpaid'})[0];
  if(ex)return ex;
  var items=[{name:'租金',amt:r.rent}];
  if(r.mW==='meter'){var rd=readingOf(rid,p);if(rd){items.push({name:'水费',amt:rd.wFee})}}
  var amt=items.reduce(function(s,x){return s+x.amt},0);
  var b={id:uid(),roomId:rid,p:p,due:dueOf(r,p),items:items,amt:Math.round(amt*100)/100,st:'unpaid',no:billNo(p),reminded:false};
  DB.bills.push(b);return b;
}
function itemAccount(name){return name==='水费'?'water':(name==='电费'?'elec':'rent')}
function itemCat(name){return name==='水费'?'水费':(name==='电费'?'电费':'租金')}
function markPaid(b,method,paidAt,note,lateAmt){
  b.st='paid';b.paidAt=paidAt||todayStr();b.method=method||'现金';b.note=note||'';
  b.latePaid=lateAmt||0;
  b.items.forEach(function(it){
    DB.flows.push({id:uid(),date:b.paidAt,account:itemAccount(it.name),dir:'in',cat:itemCat(it.name),amt:it.amt,note:room(b.roomId).code+' 账单 '+b.p,ref:b.id});
  });
  if(b.latePaid>0){DB.flows.push({id:uid(),date:b.paidAt,account:'rent',dir:'in',cat:'滞纳金',amt:b.latePaid,note:room(b.roomId).code+' 滞纳金 '+b.p,ref:b.id})}
}
function revertPaid(b){
  DB.flows=DB.flows.filter(function(f){return f.ref!==b.id});
  b.st='unpaid';b.paidAt='';b.method='';b.note='';b.latePaid=0;
}
function addExpense(account,cat,amt,date,note){DB.flows.push({id:uid(),date:date||todayStr(),account:account,dir:'out',cat:cat,amt:amt,note:note||''})}
function addIncome(account,cat,amt,date,note){DB.flows.push({id:uid(),date:date||todayStr(),account:account,dir:'in',cat:cat,amt:amt,note:note||''})}
function accounts(month){
  var A={rent:{in:0,out:0},elec:{in:0,out:0},water:{in:0,out:0}};
  DB.flows.forEach(function(f){
    if(month&&f.date.indexOf(month)!==0)return;
    if(!A[f.account])A[f.account]={in:0,out:0};
    if(f.dir==='in')A[f.account].in+=f.amt;else A[f.account].out+=f.amt;
  });
  return A;
}
function allInOut(month){
  var acc=accounts(month);
  return {in:acc.rent.in+acc.elec.in+acc.water.in, out:acc.rent.out+acc.elec.out+acc.water.out};
}
/* 报表时间段：n=1 本月 / 3 近3月 / 6 近6月 / 12 近12月 */
function rangeMonths(n){var arr=[];for(var i=n-1;i>=0;i--){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);arr.push(ym(d))}return arr}
function inRange(m,f,t){return m>=f&&m<=t}
function accountsRange(f,t){
  var A={rent:{in:0,out:0},elec:{in:0,out:0},water:{in:0,out:0}};
  DB.flows.forEach(function(fl){
    var m=fl.date.slice(0,7);
    if(!inRange(m,f,t))return;
    if(!A[fl.account])A[fl.account]={in:0,out:0};
    if(fl.dir==='in')A[fl.account].in+=fl.amt;else A[fl.account].out+=fl.amt;
  });
  return A;
}
function allInOutRange(f,t){
  var acc=accountsRange(f,t);
  return {in:acc.rent.in+acc.elec.in+acc.water.in, out:acc.rent.out+acc.elec.out+acc.water.out};
}

function vProps(){
  var q=(state.q||'').trim();
  var rooms=DB.rooms.filter(function(r){
    if(state.pf!=='all'&&rStatus(r)!==state.pf)return false;
    if(q&&(r.code.indexOf(q)<0&&r.tName.indexOf(q)<0&&prop(r.prop).name.indexOf(q)<0))return false;
    return true;
  });
  var h='<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="搜房间号 / 租客 / 小区" value="'+esc(state.q)+'"></div>';
  h+='<div class="chips">';
  [['all','全部'],['rented','已租'],['vacant','空置'],['reserved','已预定'],['overdue','逾期'],['expiring','即将到期']].forEach(function(f){
    h+='<button class="'+(state.pf===f[0]?'on':'')+'" data-pf="'+f[0]+'">'+f[1]+'</button>';
  });
  h+='</div>';
  h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><button class="chips" style="border:none;background:none;color:var(--primary);font-size:14px;padding:0" data-act="openPropAdd">+ 添加小区</button><button class="chips" style="border:none;background:none;color:var(--primary);font-size:14px;padding:0" data-act="openRoomAdd">+ 添加房源</button></div>';
  if(!rooms.length){h+='<div style="padding:40px 0;text-align:center;color:var(--muted)">没有符合条件的房源</div>';return h}
  DB.props.forEach(function(p){
    var rs=rooms.filter(function(r){return r.prop===p.id});
    if(!rs.length)return;
    h+='<div class="prop-title">'+esc(p.name)+' <b>'+rs.length+'间</b> <span style="font-weight:400">'+esc(p.addr||'')+'</span></div>';
    h+='<div class="room-grid">'+rs.map(roomCard).join('')+'</div>';
  });
  return h;
}
/* ================= 租客 ================= */
function vTenants(){
  var q=(state.tq||'').trim();
  var ts=DB.rooms.filter(function(r){return r.tName&&(!q||r.tName.indexOf(q)>-1||r.tPhone.indexOf(q)>-1||r.code.indexOf(q)>-1)});
  var h='<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="tq" placeholder="搜姓名 / 电话 / 房号" value="'+esc(state.tq)+'"></div>';
  h+='<div style="font-size:12.5px;color:var(--muted);margin-bottom:10px">共 '+ts.length+' 位在租租客</div>';
  if(!ts.length){h+='<div style="padding:40px 0;text-align:center;color:var(--muted)">暂无在租租客</div>';return h}
  ts.forEach(function(r){
    var p=prop(r.prop);
    h+='<div class="tenant-row" data-open-room="'+r.id+'"><div class="avatar">'+esc(r.tName.charAt(0))+'</div>'+
      '<div class="info"><b>'+esc(r.tName)+'</b><span>'+esc(p.name)+' · '+esc(r.code)+' '+esc(r.type)+'</span><span>'+esc(r.tPhone)+' · 租期至 '+esc(r.cEnd)+'</span>'+stChip(r)+'</div></div>';
  });
  return h;
}
/* ================= 账单 ================= */
function vBills(){
  var M=curYm(),h='';
  h+='<div class="subtabs">';
  [['unpaid','未收'],['paid','已收'],['meter','抄表']].forEach(function(f){
    h+='<button class="'+(state.bt===f[0]?'on':'')+'" data-bt="'+f[0]+'">'+f[1]+'</button>';
  });
  h+='</div>';
  if(state.bt==='meter'){return h+vMeter()}
  if(state.bt==='unpaid'){
    var rows=DB.bills.filter(function(b){return b.st==='unpaid'}).sort(function(a,b){return a.due<b.due?-1:1});
    var sum=0,ovAmt=0,ovN=0;
    DB.bills.forEach(function(b){
      if(b.p===M)sum+=b.amt;
      if(b.st==='unpaid'&&daysTo(b.due)<0){ovAmt+=b.amt;ovN++}
    });
    h+='<div class="sum2"><div class="item"><span>本月应收</span><b style="color:var(--up)">'+fmt(sum)+'</b></div><div class="item"><span>逾期未收 · '+ovN+'笔</span><b style="color:var(--up)">'+fmt(ovAmt)+'</b></div></div>';
    h+='<button class="mini-btn" data-act="copyUrgeList" style="width:100%;padding:11px 0;margin-bottom:12px">一键复制全部未收账单催收清单</button>';
    h+='<div class="card" style="padding:4px 16px">'+(rows.length?rows.map(function(b){return billRow(b,true)}).join(''):'<div style="padding:26px 0;text-align:center;color:var(--muted);font-size:13px">全部收齐，暂无未收账单</div>')+'</div>';
    h+='<button class="btn-full" data-act="genAll" style="width:100%;padding:13px 0;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:14.5px;font-weight:700">生成本月全部账单</button>';
  }else{
    var rows=DB.bills.filter(function(b){return b.st==='paid'}).sort(function(a,b){return b.paidAt<b.paidAt?1:-1});
    var sumM=rows.filter(function(b){return b.p===M}).reduce(function(s,b){return s+b.amt},0);
    h+='<div class="sum2"><div class="item"><span>本月已收</span><b style="color:var(--up)">'+fmt(sumM)+'</b></div><div class="item"><span>历史已收</span><b style="color:var(--sub)">'+fmt(rows.length)+'笔</b></div></div>';
    h+='<div class="card" style="padding:4px 16px">'+(rows.length?rows.map(function(b){return billRow(b,true)}).join(''):'<div style="padding:26px 0;text-align:center;color:var(--muted);font-size:13px">暂无已收记录</div>')+'</div>';
  }
  return h;
}
function vMeter(){
  var M=curYm(),h='';
  var w=DB.rooms.filter(function(r){return r.mW==='meter'});
  var e=DB.rooms.filter(function(r){return r.mE==='prepaid'||r.mE==='meter'});
  h+='<div class="card"><h2>水表 · 抄表计费<span class="more" data-act="openWaterRate">单价 ¥'+Number(DB.settings.wRate).toFixed(2)+'/吨</span></h2>';
  if(!w.length){h+='<div style="color:var(--muted);font-size:13px;padding:4px 0">暂无抄表计费水表</div>'}
  w.forEach(function(r){
    var rd=readingOf(r.id,M),p=prop(r.prop);
    h+='<div class="meter-row"><div class="info"><b>'+esc(p.name)+' '+esc(r.code)+' · '+esc(r.tName||'空置')+'</b><span>本期 '+(rd?('读数 '+rd.wStart+' → '+rd.wEnd+'t · '+fmt(rd.wFee)):'未录入')+'</span></div>'+
       '<button class="mini-btn" data-act="meterIn" data-rid="'+r.id+'">录入</button></div>';
  });
  h+='</div>';
  h+='<div class="card"><h2>电表 · 预付费充值<span class="more" data-act="openElecRate">说明</span></h2>'+
     '<div style="font-size:12.5px;color:var(--muted);margin-bottom:8px">电表为预付费卡充值（外部软件控制），租客充值到账后在此登记为电费收入，自动进入电费专账。</div>';
  e.forEach(function(r){
    var p=prop(r.prop);
    var sum=DB.recharges.filter(function(c){return c.roomId===r.id&&c.kind==='elec'&&c.date.indexOf(M)===0}).reduce(function(s,c){return s+c.amt},0);
    h+='<div class="meter-row"><div class="info"><b>'+esc(p.name)+' '+esc(r.code)+' · '+esc(r.tName||'空置')+'</b><span>本月已登记充值 '+fmt(sum)+'</span></div>'+
       '<button class="mini-btn" data-act="recharge" data-rid="'+r.id+'">充值登记</button></div>';
  });
  h+='</div>';
  h+='<div class="card"><h2>支出登记</h2>'+
     '<div class="row-actions"><button class="pri" data-act="expElec">记总电费</button><button class="pri" data-act="expWater">记总水费</button><button data-act="openExpense">记其他支出</button></div>'+
     '<div style="font-size:12px;color:var(--muted);margin-top:10px">总电费/总水费分别计入电费专账、水费专账，用于核算每项水电的盈亏。</div></div>';
  h+='<button class="btn-full" data-act="openMeter" style="width:100%;padding:13px 0;border:none;border-radius:12px;background:var(--primary);color:#fff;font-size:14.5px;font-weight:700">集中抄表</button>';
  return h;
}

/* ================= 合同中心 ================= */
function vContracts(){
  var h=meBack('合同中心');
  var ts=DB.rooms.filter(function(r){return r.tName}).sort(function(a,b){return a.cEnd<b.cEnd?1:-1});
  if(!ts.length){h+='<div style="padding:40px 0;text-align:center;color:var(--muted)">暂无合同</div>';return h}
  ts.forEach(function(r){
    var d=daysTo(r.cEnd),stTxt,stCls;
    if(d<0){stTxt='已到期 '+(-d)+'天';stCls='chip up'}
    else if(d<=30){stTxt='剩 '+d+'天';stCls='chip warn'}
    else{stTxt='剩 '+d+'天';stCls='chip down'}
    h+='<div class="card" style="padding:14px 16px"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+esc(r.tName)+' · '+esc(r.code)+'</b><span class="'+stCls+'">'+stTxt+'</span></div>'+
      '<div style="font-size:12.5px;color:var(--muted);margin:6px 0">'+esc(r.cStart)+' 至 '+esc(r.cEnd)+' · '+esc(r.type)+' '+esc(r.area)+' · 租金 '+fmt(r.rent)+'/月 · 押金 '+fmt(r.deposit)+'</div>'+
      '<div class="row-actions"><button class="pri" data-act="renew" data-rid="'+r.id+'">续租</button><button data-act="quit" data-rid="'+r.id+'">退租</button><button data-act="roomBill" data-rid="'+r.id+'">查看账单</button></div></div>';
  });
  return h;
}

function meterInModal(rid){
  var r=room(rid);if(!r)return;
  var rd=readingOf(rid,curYm());
  var start=rd?rd.wEnd:(r.wLast||0);
  var lastTxt=rd?('本期已录 '+rd.wStart+' → '+rd.wEnd+'t'):('上次读数 '+start+' 吨');
  openModal('水表抄表 · '+r.code,
    '<div style="font-size:13.5px;color:var(--sub);margin-bottom:12px">'+esc(r.tName||'空置')+' · '+lastTxt+' · 单价 ¥'+Number(DB.settings.wRate).toFixed(2)+'/吨</div>'+
    '<div class="form-row"><label>本期读数（吨）</label><input id="mEnd" type="number" step="0.001" min="'+start+'" placeholder="输入水表当前读数"></div>'+
    '<div class="form-row"><label>备注（可选）</label><input id="mNote" placeholder="如：月末抄表"></div>'+
    '<div class="hint" id="mHint" style="font-size:12px;color:var(--muted)"></div>'+
    '<div class="acts"><button class="btn-ghost" data-act="closeModal">取消</button><button class="btn-pri" id="mOk">保存并计入账单</button></div>');
  var v=$('#mEnd');v.addEventListener('input',function(){
    var e=parseFloat(v.value);
    if(isNaN(e)){$('#mHint').textContent='';return}
    if(e<start){$('#mHint').textContent='读数不能小于上次读数 '+start;$('#mHint').style.color='var(--up)';return}
    var fee=(e-start)*DB.settings.wRate;
    $('#mHint').textContent='本期用量 '+(e-start)+' 吨 × '+Number(DB.settings.wRate).toFixed(2)+' 元 = '+fmt(fee);
    $('#mHint').style.color='var(--muted)';
  });
  $('#mOk').addEventListener('click',function(){
    var e=parseFloat(v.value),note=$('#mNote').value.trim();
    if(isNaN(e)||e<start){toast('请填写有效的本期读数');return}
    var fee=Math.round((e-start)*DB.settings.wRate*100)/100,p=curYm();
    var rd2=readingOf(rid,p);
    if(rd2){rd2.wEnd=e;rd2.wFee=fee}else{DB.readings.push({id:uid(),roomId:rid,p:p,wStart:start,wEnd:e,wFee:fee})}
    r.wLast=e;
    var bill=genBill(rid,p);
    bill.items=bill.items.filter(function(it){return it.name!=='水费'});
    if(fee>0)bill.items.push({name:'水费',amt:fee});
    bill.amt=Math.round(bill.items.reduce(function(s,x){return s+x.amt},0)*100)/100;
    save();closeModal();closeSheet();render();
    toast('已录入，水费 '+fmt(fee)+' 计入账单');
  });
}

/* ================= 照片账单（Canvas） ================= */
function cnMoney(n){
  if(n===null||n===undefined||isNaN(n))return'零元整';
  var neg=n<0;n=Math.abs(n);
  var d='零壹贰叁肆伍陆柒捌玖';
  var u=['','拾','佰','仟'],b=['','万','亿'];
  var yuan=Math.floor(n),dec=Math.round((n-yuan)*100);
  var jiao=Math.floor(dec/10),fen=dec%10;
  var s='',zero=false,groups=[];var x=yuan;
  while(x>0){groups.push(x%10000);x=Math.floor(x/10000)}
  for(var i=groups.length-1;i>=0;i--){
    var g=groups[i],sec='';
    for(var k=3;k>=0;k--){
      var v=Math.floor(g/Math.pow(10,k))%10;
      if(v===0){zero=true}
      else{
        if(zero&&(s!==''||sec!=='')){sec+='零'}
        zero=false;
        sec+=d[v]+u[k];
      }
    }
    if(sec!==''){s+=sec+b[i]}
  }
  if(yuan===0)s='零';
  s+='元';
  if(jiao===0&&fen===0)s+='整';
  else{
    if(jiao>0)s+=d[jiao]+'角';
    else if(fen>0)s+='零';
    if(fen>0)s+=d[fen]+'分';
  }
  return (neg?'负':'')+s;
}
function rr(g,x,y,w,h,r){g.beginPath();if(g.roundRect){g.roundRect(x,y,w,h,r)}else{g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}g.fill()}
function drawBill(b){
  var r=room(b.roomId),p=prop(r.prop);
  var W=750,pad=44,X1=pad,X2=W-pad;
  var nItems=b.items.length;
  var H=1060+nItems*62;
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var g=c.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,W,H);
  /* 头部横幅 */
  var hg=g.createLinearGradient(0,0,0,158);hg.addColorStop(0,'#2E90FA');hg.addColorStop(1,'#5EA9F9');
  g.fillStyle=hg;g.fillRect(0,0,W,158);
  g.fillStyle='#fff';g.textAlign='left';g.font='bold 46px sans-serif';g.fillText('智租管家',X1,74);
  g.font='23px sans-serif';g.fillStyle='rgba(255,255,255,.92)';g.fillText('电子账单 · 收款凭证',X1,112);
  g.font='24px sans-serif';g.fillStyle='rgba(255,255,255,.9)';g.textAlign='right';g.fillText(b.no||'',X2,64);
  g.font='22px sans-serif';g.fillStyle='rgba(255,255,255,.78)';g.fillText('出账日期 '+todayStr(),X2,104);
  /* 账单信息卡 */
  var metaY=184,rowH=64,cPad=36,cH=3*rowH+cPad*2;
  g.fillStyle='#fff';g.strokeStyle='#E7EDF5';g.lineWidth=2;
  rr(g,X1,metaY,W-pad*2,cH,22);g.stroke();
  var cells=[['小区',p.name],['房间',r.code+' · '+r.type],['租客',r.tName||'—'],['电话',r.tPhone||'—'],['账期',b.p],['收租日',b.due]];
  var lx=[X1+30,X1+356],vx=[X1+165,X1+486];
  cells.forEach(function(cell,i){
    var col=i%2,rowN=Math.floor(i/2);
    var yy=metaY+cPad+rowN*rowH;
    g.textAlign='left';
    g.fillStyle='#98A1B3';g.font='22px sans-serif';g.fillText(cell[0],lx[col],yy+30);
    g.fillStyle='#1B2537';g.font='bold 26px sans-serif';g.fillText(cell[1],vx[col],yy+30);

  var hdrY=y+22;
  g.fillStyle='#98A1B3';g.font='21px sans-serif';g.fillText('项目',X1+30,hdrY+26);g.textAlign='right';g.fillText('金额（元）',X2-30,hdrY+26);
  g.strokeStyle='#E3E8F0';g.lineWidth=2;g.setLineDash([6,8]);
  g.beginPath();g.moveTo(X1+30,hdrY+42);g.lineTo(X2-30,hdrY+42);g.stroke();g.setLineDash([]);
  y=hdrY+42;
  b.items.forEach(function(it){
    y+=62;
    g.textAlign='left';g.fillStyle='#3A4557';g.font='28px sans-serif';g.fillText(it.name,X1+30,y);
    g.textAlign='right';g.fillStyle='#1B2537';g.font='bold 29px sans-serif';g.fillText('¥'+Number(it.amt).toFixed(2),X2-30,y);
    g.strokeStyle='#EEF1F6';g.lineWidth=1.5;g.beginPath();g.moveTo(X1+30,y+24);g.lineTo(X2-30,y+24);g.stroke();
  });
  y+=46;
  /* 应收合计 */
  var fee=lateFee(b),od=overdueDays(b),stS=DB.settings;
  var rows=[],finalAmt=b.amt;
  if(b.st==='unpaid'){
    rows.push(['应收合计',fmt(b.amt),'#1B2537',30,false]);
    if(fee>0){rows.push(['滞纳金（逾期'+od+'天×'+Number(stS.lateRate).toFixed(1)+'%/天）','+'+fmt(fee),'#E5484D',26,false]);finalAmt=b.amt+fee}
    rows.push(['应付合计',fmt(finalAmt),'#E5484D',42,true]);
  }else{
    var paidAmt=b.amt+(b.latePaid||0);
    rows.push(['应收合计',fmt(b.amt),'#1B2537',30,false]);
    if((b.latePaid||0)>0){rows.push(['滞纳金','+'+fmt(b.latePaid),'#E5484D',26,false]);finalAmt=paidAmt}
    rows.push([(b.latePaid||0)>0?'实收金额':'已收金额',fmt(finalAmt),(b.latePaid||0)>0?'#E5484D':'#1FA36B',42,true]);
  }
  var totalH=rows.length===3?176:132;
  g.fillStyle='#EFF6FF';
  rr(g,X1,y,W-pad*2,totalH,20);
  var rowsY=totalH===176?[38,80,124]:[42,88];
  rows.forEach(function(row,i){
    g.textAlign='left';g.fillStyle='#1B2537';g.font='bold 27px sans-serif';
    g.fillText(row[0],X1+30,y+rowsY[i]);
    g.textAlign='right';g.fillStyle=row[2];g.font=(row[4]?'bold 42px':'bold '+row[3]+'px')+' sans-serif';
    g.fillText(row[1],X2-30,y+rowsY[i]+4);
  });
  g.textAlign='left';g.fillStyle='#5C6B84';g.font='22px sans-serif';
  g.fillText('人民币 '+cnMoney(finalAmt),X1+30,y+totalH-28);
  y+=totalH+16;
  /* 状态横幅 */
  var od=overdueDays(b),stBg,stTxt;
  if(b.st==='paid'){stBg='#1FA36B';stTxt='已于 '+b.paidAt+' 缴付（'+b.method+'）'}
  else if(od>0){stBg='#E5484D';stTxt='本账单已逾期 '+od+' 天，请尽快缴付'}
  else{stBg='#F79009';stTxt='请于 '+b.due+' 前缴付，感谢配合'}
  g.fillStyle=stBg;
  rr(g,X1,y,W-pad*2,66,16);
  g.fillStyle='#fff';g.font='bold 26px sans-serif';g.textAlign='left';g.fillText(stTxt,X1+28,y+43);
  y+=66+26;
  /* 页脚 */
  g.fillStyle='#98A1B3';g.font='22px sans-serif';
  g.fillText('温馨提示：逾期未缴将影响续租，请按时缴付。',X1,y);y+=36;
  g.fillText('本账单由「智租管家」生成，如有疑问请联系房东。',X1,y);y+=36;
  g.fillText('生成时间：'+new Date().toLocaleString('zh-CN'),X1,y);y+=44;
  g.strokeStyle='#EEF1F6';g.lineWidth=2;g.beginPath();g.moveTo(X1,y);g.lineTo(X2,y);g.stroke();y+=30;
  g.fillStyle='#B7C0CE';g.font='20px sans-serif';g.textAlign='center';g.fillText('智租管家 · 租房管理',W/2,y);
  return c.toDataURL('image/png');
}

function qrPlaceholder(seed){
  var s=160,c=document.createElement('canvas');c.width=s;c.height=s;
  var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,s,s);
  var n=0;for(var i=0;i<seed.length;i++)n=(n*31+seed.charCodeAt(i))>>>0;
  var size=s/25;
  function cell(x,y,v){if(!v)return;g.fillStyle='#1B2537';g.fillRect(Math.round(x*size),Math.round(y*size),Math.ceil(size),Math.ceil(size))}
  [[0,0],[0,18],[18,0]].forEach(function(f){
    for(var y=0;y<7;y++)for(var x=0;x<7;x++){var on=(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4));cell(f[0]+x,f[1]+y,on)}
  });
  for(var y=0;y<25;y++)for(var x=0;x<25;x++){
    if((x<9&&y<9)||(x<9&&y>=16)||(x>=16&&y<9))continue;
    n=(n*1103515245+12345)>>>0;cell(x,y,n%100<48);
  }
  return c.toDataURL('image/png');
}

  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(){

    fr.readAsText(f);
  };
  inp.click();
}

    case 'openExpense':expenseModal('rent');break;
    case 'expElec':expenseModal('elec');break;
    case 'expWater':expenseModal('water');break;
    case 'openIncome':incomeModal();break;
    case 'openRoomAdd':openRoomAdd();break;
    case 'openPropAdd':openPropAdd();break;
    case 'genAll':genAllBills();break;
    case 'saveRates':
      var w=parseFloat($('#setW').value),e=parseFloat($('#setE').value);
      if(isNaN(w)||w<0||isNaN(e)||e<0){toast('单价无效');break}
      DB.settings.wRate=w;DB.settings.eRate=e;save();render();toast('单价已保存');break;
    case 'saveLate':
      var lr=parseFloat($('#setLateRate').value),lc=parseFloat($('#setLateCap').value);
      if(isNaN(lr)||lr<0||isNaN(lc)||lc<0||lc>100){toast('滞纳金参数无效');break}
      DB.settings.lateRate=lr;DB.settings.lateCap=lc;save();render();toast('滞纳金设置已保存');break;
    case 'setQr':
      var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
      inp.onchange=function(){
        var f=inp.files[0];if(!f)return;
        if(f.size>3*1024*1024){toast('图片请小于 3MB');return}
        var fr=new FileReader();
        fr.onload=function(){DB.settings.qr=fr.result;save();render();toast('收款码已保存')};
        fr.readAsDataURL(f);
      };
      inp.click();break;
    case 'clearQr':DB.settings.qr=null;save();render();toast('已清除收款码');break;
    case 'openReceipt':openReceipt();break;
    case 'saveRemind':
      var rd=parseInt($('#setRemind').value);
      if(isNaN(rd)||rd<0||rd>30){toast('请输入 0-30 之间的天数');break}
      DB.settings.remindDays=rd;save();render();toast('已保存');break;
    case 'meBack':state.meView=null;render();break;
    case 'exportData':exportData();break;
    case 'importData':importData();break;
    case 'resetDemo':resetDemo();break;
    case 'clearData':clearData();break;
    case 'exportFlowsCsv':exportFlowsCsv();break;
    case 'exportRoomsCsv':exportRoomsCsv();break;
    case 'copyUrgeList':copyUrgeList();break;
    case 'openWaterRate':state.meView='settings';render();break;
    case 'openElecRate':state.meView='settings';render();break;
  }
});
window.addEventListener('hashchange',route);
/* ================= 输入框事件（渲染后绑定，保持焦点） ================= */
var _bindQ=function(){
  var q=$('#q');
  if(q){q.addEventListener('input',function(){
    state.q=q.value;render();
    var n=$('#q');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}
  })}
  var tq=$('#tq');
  if(tq){tq.addEventListener('input',function(){
    state.tq=tq.value;render();
    var n=$('#tq');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}
  })}
};
/* ================= 初始化 ================= */
document.addEventListener('DOMContentLoaded',function(){
  load();applyTheme();
  $('#themeBtn').addEventListener('click',cycleTheme);
  $('#sheetMask').addEventListener('click',closeSheet);
  $('#modalMask').addEventListener('click',closeModal);
  render();
  route();
});
</script>
</script>
</body>
